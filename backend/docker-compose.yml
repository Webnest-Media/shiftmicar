services:
  postgres:
    image: postgres:16-alpine
    container_name: shiftmycar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiftmycar
      POSTGRES_PASSWORD: shiftmycar
      POSTGRES_DB: shiftmycar
    ports:
      - "5432:5432"
    volumes:
      - shiftmycar_pg_data:/var/lib/postgresql/data

volumes:
  shiftmycar_pg_data:
