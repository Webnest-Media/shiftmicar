<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none" class="w-auto h-8 text-foreground">
  <!-- Toyota Ellipse Emblem -->
  <g transform="translate(6, 6) scale(0.9)">
    <!-- Outer Ellipse -->
    <ellipse cx="20" cy="18" rx="17" ry="12" stroke="currentColor" stroke-width="2.2" fill="none"/>
    <!-- Inner Vertical Ellipse (forms T) -->
    <ellipse cx="20" cy="17" rx="6.5" ry="11" stroke="currentColor" stroke-width="2" fill="none"/>
    <!-- Inner Horizontal Ellipse (crossbar of T) -->
    <ellipse cx="20" cy="12" rx="12" ry="5" stroke="currentColor" stroke-width="2" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="50" y="27" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="currentColor">TOYOTA</text>
</svg>
